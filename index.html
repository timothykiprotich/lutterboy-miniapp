<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lutterboy Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { background: #000; color: white; font-family: sans-serif; padding: 20px; }
    h1 { color: #00ff88; text-align: center; }
    label { display: block; margin-top: 10px; }
    input, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; background: #111; color: white; }
    button { width: 100%; background: #00ff88; color: #000; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; margin-top: 15px; }
  </style>
</head>
<body>
  <h1>Lutterboy Form</h1>
  <form id="myForm">
    <label>Name</label>
    <input type="text" id="name" required>
    
    <label>Email</label>
    <input type="email" id="email" required>
    
    <label>Message</label>
    <textarea id="message" rows="3"></textarea>
    
    <button type="submit">Submit</button>
  </form>

  <script>
    let tg = window.Telegram.WebApp;
    tg.expand();
    
    document.getElementById('myForm').addEventListener('submit', function(e) {
      e.preventDefault();
      let data = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value
      };
      tg.sendData(JSON.stringify(data)); // sends to bot
      tg.close();
    });
  </script>
</body>
</html>
